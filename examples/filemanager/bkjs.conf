app-log=info

files-file-root = .

# enable users module
api-users-table = bk_user

# protected endpoints
api-acl-add-* = ^/api
api-acl-allow-api = api

#middleware-users-enable-token = /api/*

middleware-static-enable = true
middleware-body-enable = true

# Rate limit the public and authenticated write paths.
middleware-limiter-enable = true
middleware-limiter-ip-*-/api/* = rate:100,interval:1000
middleware-limiter-user-*-/api/* = rate:10,interval:1000

# default database, sqlite as the primary pool
db-pool=sqlite
db-sqlite-pool=var/pings

# AWS DynamoDB
[roles=dynamodb]
db-pool=dynamodb
db-dynamodb-pool = default

# Local DynamoDB
[roles=ddb]
db-pool=dynamodb
db-dynamodb-pool = http://localhost:8181

# Local PostgreSQL-like dbs
[roles=pg]
db-pool=pg
db-pg-pool=default

[global]

include bkjs.conf.local

